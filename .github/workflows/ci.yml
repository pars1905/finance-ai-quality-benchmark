name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m finance_benchmark run --provider baseline --output /tmp/finance-benchmark-report
      - run: python -m finance_benchmark evaluate examples/sample_predictions.json --output /tmp/finance-benchmark-sample
      - run: python -m finance_benchmark run --provider baseline --dataset real-filings-v1 --output /tmp/finance-real-control
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            /tmp/finance-benchmark-report/
            /tmp/finance-benchmark-sample/
            /tmp/finance-real-control/
